# Gradle
org.gradle.jvmargs=-Xmx4G
org.gradle.parallel=true

# Fabric
minecraft_version=1.21.11
loader_version=0.18.2
loom_version=1.17-SNAPSHOT

# Mod
mod_version=1.0.0
maven_group=com.whaltermc
archives_base_name=flashback-redroided

# Fabric API
fabric_api_version=0.140.2+1.21.11

# Flashback (compile-time only). Works with Flashback >= 0.39.3 at runtime:
# 0.39.0 - 0.39.1 still use the un-relocated "imgui" package, which is not remapped.
flashback_version=0.39.3

# Android natives (Maven Central). These MUST match the JavaCV bundled by Flashback
# on 1.21.11 (JavaCV 1.5.10 -> FFmpeg 6.1.1). FFmpeg 7/8 removed API that JavaCV 1.5.10 calls.
javacpp_version=1.5.10
ffmpeg_version=6.1.1-1.5.10
