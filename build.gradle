plugins {
id 'fabric-loom' version "${loom_version}"
id 'com.gradleup.shadow' version '9.2.2'
id 'maven-publish'
}

group = project.maven_group
version = project.mod_version

base {
archivesName = project.archives_base_name
}

repositories {
maven {
name = "Modrinth"
url = "https://api.modrinth.com/maven"
}
maven {
name = "Fabric"
url = "https://maven.fabricmc.net/"
}
mavenCentral()
}

loom {
splitEnvironmentSourceSets()

mods {
    "flashback-redroided" {
        sourceSet sourceSets.main
        sourceSet sourceSets.client
    }
}

}

dependencies {
minecraft "com.mojang:minecraft:${minecraft_version}"
mappings loom.officialMojangMappings()
modImplementation "net.fabricmc:fabric-loader:${loader_version}"
modImplementation "net.fabricmc.fabric-api:fabric-api:${fabric_api_version}"

modCompileOnly "maven.modrinth:4das1Fjq:${flashback_version}"

// Natives only. The Java bindings (org.bytedeco.*) already ship inside Flashback's jar,
// and the native build has to match them exactly (see gradle.properties).
shadow("org.bytedeco:javacpp:${javacpp_version}:android-arm64") { transitive = false }
shadow("org.bytedeco:ffmpeg:${ffmpeg_version}:android-arm64-gpl") { transitive = false }

shadow files("deps/imgui-binding-1.92.jar")
shadow files("deps/imgui-java-natives-android.jar")

}

def modVersion = providers.gradleProperty("mod_version")

processResources {
inputs.property("version", modVersion)

filesMatching("fabric.mod.json") {
    expand(version: modVersion.get())
}

}

java {
withSourcesJar()
sourceCompatibility = JavaVersion.VERSION_21
targetCompatibility = JavaVersion.VERSION_21
}

tasks.withType(JavaCompile).configureEach {
options.release = 21
}

jar {
archiveBaseName.set(project.archives_base_name)

from("LICENSE") {
    rename { "${it}_flashback-redroided" }
}

}

shadowJar {
archiveBaseName.set("${project.archives_base_name}-${project.minecraft_version}")
archiveVersion.set(project.version.toString())
// Intermediate (still Mojang-named) jar. Do NOT install this one, use the remapped jar in build/libs.
destinationDirectory.set(layout.buildDirectory.dir("tmp/allJar"))

from(sourceSets.main.output)
from(sourceSets.client.output)

configurations = [project.configurations.shadow]

exclude("LICENSE")
exclude("LICENSE.txt")

}

// 1.21.11 is obfuscated at runtime, so the shaded jar has to be remapped to intermediary.
remapJar {
dependsOn(shadowJar)
input = shadowJar.getArchiveFile()
archiveBaseName.set("${project.archives_base_name}-${project.minecraft_version}")
}

tasks.named("assemble") {
dependsOn(remapJar)
}